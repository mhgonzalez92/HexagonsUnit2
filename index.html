<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Classroom tabletop. Teacher: setup + class grid + projector view. Student: one group board + own hand. */
:root{
  --bg:#e7e9e3; --table:#dfe3db; --dot:#c4cabd; --panel:#f7f8f4; --panel-2:#eef0ea;
  --ink:#1d2120; --muted:#5e665f; --line:#cdd2c8; --card:#ffffff; --card-ink:#1d2120; --card-sub:#4b524c;
  --accent:#2f6f5e; --accent-ink:#ffffff; --slot:#2f6f5e33; --cut:#1d2120; --warn:#b85c00;
  --s-caribbean:#1d7fa8; --s-olmec:#8a5a3c; --s-aztec:#2f8a4c; --s-maya:#7a4a9e; --s-inca:#f28c1e; --s-concepts:#8f8f8f; --s-wild:#c2185b;
  --f-card:"Poppins",system-ui,sans-serif; --f-ui:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141716; --table:#1a1e1c; --dot:#2c322f; --panel:#1f2321; --panel-2:#262b28;
  --ink:#e8ece7; --muted:#a3aba4; --line:#343a36; --card:#232826; --card-ink:#f1f4f0; --card-sub:#b9c0ba;
  --accent:#6cc3a8; --accent-ink:#0f1412; --slot:#6cc3a833; --cut:#cfd5cf; --warn:#ffb347;
  --s-caribbean:#4fb3dc; --s-olmec:#c48a62; --s-aztec:#5cc07b; --s-maya:#b48ad6; --s-inca:#ffa64a; --s-concepts:#9aa19b; --s-wild:#f06292;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141716; --table:#1a1e1c; --dot:#2c322f; --panel:#1f2321; --panel-2:#262b28;
  --ink:#e8ece7; --muted:#a3aba4; --line:#343a36; --card:#232826; --card-ink:#f1f4f0; --card-sub:#b9c0ba;
  --accent:#6cc3a8; --accent-ink:#0f1412; --slot:#6cc3a833; --cut:#cfd5cf; --warn:#ffb347;
  --s-caribbean:#4fb3dc; --s-olmec:#c48a62; --s-aztec:#5cc07b; --s-maya:#b48ad6; --s-inca:#ffa64a; --s-concepts:#9aa19b; --s-wild:#f06292;
  color-scheme:dark}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-card);font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand svg{width:22px;height:22px}
.gname{font-family:var(--f-card);font-weight:800;font-size:20px}
.tabs{display:flex;gap:4px}
.tab{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sep{width:1px;height:26px;background:var(--line)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.big{padding:10px 16px;font-size:16px}
.btn[aria-pressed="true"]{background:var(--panel-2);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{width:3.4em;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px;text-align:center}
.spacer{flex:1}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
.chip[aria-pressed="false"]{opacity:.55}
.status{font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap;background:transparent;cursor:pointer}
.status::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.status[data-mode="offline"]::before{background:#d9822b}
.status[data-mode="pending"]::before{background:var(--muted)}
main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.scroll{overflow:auto;flex:1;padding:18px}
/* lobby */
.center{flex:1;display:grid;place-items:center;padding:16px;overflow:auto}
.card-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(480px,100%);display:flex;flex-direction:column;gap:14px}
.card-box h2{margin:0;font-family:var(--f-card)}
.card-box p{margin:0;color:var(--muted);line-height:1.45}
.choice{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:9px;background:var(--card)}
.choice b{font-family:var(--f-card)}
.field{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 10px;width:100%}
.codein{text-transform:uppercase;letter-spacing:.25em;font-weight:700;font-size:20px;text-align:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg{color:var(--warn);font-weight:700;min-height:1.2em}
/* teacher setup */
.joinbanner{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:16px}
.bigcode{font-family:var(--f-card);font-weight:800;font-size:46px;letter-spacing:.18em;color:var(--accent);line-height:1}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col.unassigned{border-style:dashed}
.col h3{margin:0;font-family:var(--f-card);font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.col h3 input{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 5px;font-family:var(--f-card);font-weight:700}
.col h3 input:hover,.col h3 input:focus{border-color:var(--line);background:var(--card)}
.stu{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 7px}
.stu .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.stu select{border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:2px 4px;font-size:13px;max-width:110px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.dot.off{background:#c9cfc5}
.x{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:16px;padding:0 3px}
.hint{color:var(--muted);font-size:13px}
.lock{font-size:12px;color:var(--muted);font-weight:700}
/* class grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tile h3{margin:0;font-family:var(--f-card);font-size:17px}
.mini{position:relative;height:210px;border-radius:10px;overflow:hidden;background-color:var(--table);background-image:radial-gradient(var(--dot) 1px,transparent 1.4px);background-size:16px 16px;cursor:pointer}
.mini .emptytxt{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
/* board */
.board{position:relative;overflow:hidden;background-color:var(--table);background-image:radial-gradient(var(--dot) 1px,transparent 1.4px);background-size:22px 22px;touch-action:none;cursor:grab;flex:1;min-height:0}
.board.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;color:var(--muted);padding:24px}
.empty div{max-width:36ch;line-height:1.5}
.empty strong{display:block;font-family:var(--f-card);font-size:20px;color:var(--ink);margin-bottom:6px}
.zoomctl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.zoomctl .btn{justify-content:center;width:40px;height:40px;padding:0;font-size:18px}
.projname{position:absolute;left:16px;top:12px;font-family:var(--f-card);font-weight:800;font-size:28px;pointer-events:none;text-shadow:0 1px 0 var(--table)}
/* hex card */
.hex{position:absolute;width:var(--w);height:var(--h);touch-action:none;user-select:none;cursor:grab}
.hex .o,.hex .m,.hex .c,.hex .i{position:absolute;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.hex .o{inset:0;background:var(--cut)}
.hex .m{background:var(--card)}
.hex .c{background:var(--sc)}
.hex .i{background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8%;overflow:hidden}
.nocolor .hex .c{background:var(--s-concepts)}
.hex .t{font-family:var(--f-card);font-weight:800;color:var(--card-ink);font-size:var(--ts);line-height:1.12;text-wrap:balance}
.hex .f{font-family:var(--f-card);font-weight:500;color:var(--card-sub);font-size:var(--fs);line-height:1.3;margin-top:5px;text-wrap:balance}
.nofacts .hex .f{display:none}
.nofacts .hex.wild .f{display:block}
.hex.dragging{opacity:.35}
.hex.static{cursor:default}
.ghost{position:fixed;pointer-events:none;z-index:50;filter:drop-shadow(0 10px 18px rgba(0,0,0,.28))}
.slot{position:absolute;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--slot);pointer-events:none}
.slot.hot{background:var(--accent);opacity:.45}
.edit{position:absolute;right:18%;top:12%;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:13px;cursor:pointer;z-index:2}
/* hand */
.hand{background:var(--panel);border-top:1px solid var(--line);padding:8px 14px 10px;display:flex;gap:12px;align-items:center;min-width:0}
.hand-label{display:flex;flex-direction:column;gap:2px;flex:0 0 auto;max-width:120px}
.hand-label b{font-family:var(--f-card);font-size:14px}
.hand-list{display:flex;gap:6px;overflow-x:auto;padding:4px 2px;min-height:110px;align-items:center;flex:1;min-width:0}
.hand-list .hex{position:relative;flex:0 0 auto;touch-action:pan-x}
.hand-empty{color:var(--muted);font-size:13px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:60;padding:16px}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(440px,100%);display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 32px)}
.dialog.wide{width:min(620px,100%)}
.dialog h3{margin:0;font-family:var(--f-card)}
.dialog p{margin:0;color:var(--muted);line-height:1.45}
.dialog .row{justify-content:flex-end}
.dlist{overflow:auto;display:flex;flex-direction:column;gap:4px;padding-right:4px}
.dsec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:10px 0 2px}
.drow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:var(--card);border:1px solid var(--line)}
.drow b{font-family:var(--f-card);font-weight:700;font-size:13px;flex:1;min-width:0}

function spiralFree(g){
  const dirs=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
  if(!occupant(g,0,0)) return [0,0];
  for(let k=1;k<40;k++){ let q=-k, r=k; for(let d=0;d<6;d++) for(let s=0;s<k;s++){ if(!occupant(g,q,r)) return [q,r]; q+=dirs[d][0]; r+=dirs[d][1]; } }

const T={ game:null, conns:{}, screen:"setup", proj:null };
function defaultGame(){ return {settings:{facts:true, colors:true, sets:SOCIETIES.slice(), dealN:5}, students:{}, groups:[newGroup(1),newGroup(2),newGroup(3)], round:1}; }
function newGroup(n){ return {id:"g"+rid(), name:"Group "+n, locked:false, order:Date.now()+n, place:{}}; }
const G=gid=>T.game.groups.find(g=>g.id===gid);

const online=sid=>{ const c=T.conns[sid]; return !!(c && c.open); };
function returnHand(g,sid){ if(!g) return; Object.keys(g.place).forEach(id=>{ const e=g.place[id]; if(e.o===sid && (e.z==="hand")) delete g.place[id]; }); }
function dealTo(g,sid,n){
  const sets=SETS.filter(s=>T.game.settings.sets.includes(s)||s==="Concepts"||s==="Wild Card");
  const deck=inZone(g,"deck");
  const pools=shuf(sets.map(s=>{ const p=shuf(deck.filter(id=>cardOf(id).s===s)); return s==="Wild Card"?p.slice(0,WILD_CAP):p; }).filter(p=>p.length));
  const take=[]; let k=0;
  while(take.length<n && pools.some(p=>p.length)){ const p=pools[k%pools.length]; if(p.length) take.push(p.pop()); k++; }
  const now=Date.now(); shuf(take).forEach((id,i)=>{ g.place[id]={z:"hand",o:sid,h:now+i}; });
  return take.length;
}
function dealGroup(g){ let got=0; shuf(members(g.id)).forEach(sid=>{ got+=dealTo(g,sid,T.game.settings.dealN); }); return got; }
function collectGroup(g){ g.place={}; }
function placeCard(g,sid,cid,q,r,isTeacher){
  if(!IDSET.has(cid) || Math.abs(q)>40 || Math.abs(r)>40) return false;
  const e=ent(g,cid), occ=occupant(g,q,r);
  if(e.z==="hand" && (isTeacher || e.o===sid)){
    if(occ || wildType(cardOf(cid))==="switch") return false;
    g.place[cid]={z:"board",q,r,o:e.o,t:e.t,f:e.f}; return true;
  }
  if(e.z==="board"){
    if(occ && occ!==cid){ const oe=g.place[occ]; g.place[occ]={...oe,q:e.q,r:e.r}; }
    g.place[cid]={...e,q,r}; return true;
  }
  return false;
}
function studentOp(sid,op){
  const st=T.game.students[sid]; if(!st || !op || typeof op!=="object") return;
  const g=G(st.gid);
  if(op.t==="place"){ if(g) placeCard(g,sid,String(op.cid),op.q|0,op.r|0,false); }
  else if(op.t==="rename"){ const n=clean(op.name,30); if(g && !g.locked && n){ g.name=n; g.locked=true; g.namedBy=sid; } }
  else if(op.t==="swap"){
    if(!g) return; const wid=String(op.wild), cid=String(op.cid);
    if(!IDSET.has(wid)||!IDSET.has(cid)||wid===cid) return;
    const we=ent(g,wid); if(wildType(cardOf(wid))!=="switch" || we.z!=="hand" || we.o!==sid) return;
    const te=ent(g,cid);
    if(te.z==="hand" && te.o!==sid){
      const rep=shuf(inZone(g,"deck").filter(id=>wildType(cardOf(id))!=="switch"))[0];
      if(rep) g.place[rep]={z:"hand",o:te.o,h:Date.now()};
    } else if(te.z!=="deck") return;
    g.place[cid]={z:"hand",o:sid,h:Date.now(),t:te.t,f:te.f};
    g.place[wid]={z:"used"};
  }
  else if(op.t==="write"){
    if(!g) return; const cid=String(op.cid); if(!IDSET.has(cid) || !cardOf(cid).w) return;
    const e=ent(g,cid); if(!((e.z==="hand"||e.z==="board") && e.o===sid)) return;
    g.place[cid]={...e,t:clean(op.text,60),f:clean(op.fact,110)};
  }
  changed();
}
function stateFor(sid){
  const st=T.game.students[sid], g=st&&G(st.gid), names={};
  if(g) members(g.id).forEach(s=>{ names[s]=T.game.students[s].name; });
  return {t:"state", me:{sid, name:st?st.name:"", gid:g?g.id:null}, group:g||null, names, settings:T.game.settings, round:T.game.round};
}
let bcT=null;
function changed(){ store.set("hexlive-game-"+code, T.game); clearTimeout(bcT); bcT=setTimeout(broadcast,25); renderTeacher(); }
function broadcast(){ Object.keys(T.conns).forEach(sid=>{ const c=T.conns[sid]; try{ if(c.open) c.send(stateFor(sid)); }catch(e){} }); }
function startTeacher(c,tries){
  tries=tries||0; role="teacher"; code=c; netMode="pending";
  store.set("hexlive-lastroom", c);
  T.game = store.get("hexlive-game-"+c) || T.game || defaultGame();
  if(peer){ try{ peer.destroy(); }catch(e){} }
  renderTeacher();
  peer=new Peer(pid(c), PEER_OPTS());
  peer.on("open",()=>{ netMode="live"; renderTeacher(); });
  peer.on("connection",conn=>{
    conn.on("data",op=>{
      if(op && op.t==="hello"){
        const sid=clean(op.sid,40), name=clean(op.name,24)||"Student"; if(!sid) return;
        conn.sid=sid; const old=T.conns[sid]; if(old && old!==conn){ try{ old.close(); }catch(e){} }
        T.conns[sid]=conn;
        if(!T.game.students[sid]) T.game.students[sid]={name, gid:null, joined:Date.now()}; else T.game.students[sid].name=name;
        changed(); return;
      }
      if(conn.sid) studentOp(conn.sid, op);
    });
    conn.on("close",()=>{ if(conn.sid && T.conns[conn.sid]===conn) delete T.conns[conn.sid]; renderTeacher(); });
    conn.on("error",()=>{});
  });
  peer.on("error",e=>{
    if(e.type==="unavailable-id"){ if(tries<6){ toast("Reopening room "+c+"…"); setTimeout(()=>startTeacher(c,tries+1),3000); } else { toast("That code is busy. Opening a new room."); startTeacher(newCode(),0); } }
    else if(["network","server-error","socket-error","socket-closed"].includes(e.type)){ netMode="offline"; renderTeacher(); toast("Can't reach the room server. Check the Wi-Fi."); }
  });
  peer.on("disconnected",()=>{ netMode="offline"; renderTeacher(); setTimeout(()=>{ try{ peer.reconnect(); }catch(e){} },2500); });
}
function moveStudent(sid,gid){ const st=T.game.students[sid]; if(!st || st.gid===gid) return; returnHand(G(st.gid),sid); st.gid=gid||null; changed(); }
function removeStudent(sid){ const st=T.game.students[sid]; if(!st) return; returnHand(G(st.gid),sid); delete T.game.students[sid]; const c=T.conns[sid]; if(c){ try{ c.send({t:"removed"}); c.close(); }catch(e){} delete T.conns[sid]; } changed(); }
function autoAssign(n){
  n=Math.max(1,Math.min(12,n|0));
  while(T.game.groups.length<n) T.game.groups.push(newGroup(T.game.groups.length+1));
  const sids=shuf(Object.keys(T.game.students));
  sids.forEach((sid,i)=>{ const st=T.game.students[sid], gid=T.game.groups[i%n].id; if(st.gid!==gid){ returnHand(G(st.gid),sid); st.gid=gid; } });
  changed();
}
function newGame(){ T.game.groups.forEach((g,i)=>{ g.place={}; g.locked=false; g.name="Group "+(i+1); delete g.namedBy; }); T.game.round++; changed(); }

const S={ conn:null, state:null, sid:"", name:"", first:true, retryT:null };
function startStudent(c,name){
  role="student"; code=c; netMode="pending";
  S.sid = store.get("hexlive-sid") || ("s"+rid()); store.set("hexlive-sid", S.sid);
  S.name=name; store.set("hexlive-name", name);
  try{ history.replaceState(null,"",location.pathname+"?room="+c); }catch(e){}
  renderStudent();
  peer=new Peer(PEER_OPTS());
  peer.on("open",connectHost);
  peer.on("error",e=>{
    if(e.type==="peer-unavailable"){ netMode="offline"; renderStudent(); toast("Room "+c+" isn't open. Check the code with your teacher. Trying again…"); retry(); }
    else if(["network","server-error","socket-error","socket-closed"].includes(e.type)){ netMode="offline"; renderStudent(); retry(); }
  });
  peer.on("disconnected",()=>{ setTimeout(()=>{ try{ peer.reconnect(); }catch(e){} },2500); });
}
function retry(){ clearTimeout(S.retryT); S.retryT=setTimeout(connectHost,4000); }
function connectHost(){
  if(!peer || peer.destroyed) return; if(S.conn && S.conn.open) return;
  if(peer.disconnected){ try{ peer.reconnect(); }catch(e){} retry(); return; }
  const c=peer.connect(pid(code),{reliable:true}); S.conn=c;
  c.on("open",()=>{ netMode="live"; c.send({t:"hello", sid:S.sid, name:S.name}); renderStudent(); });
  c.on("data",m=>{
    if(m && m.t==="removed"){ S.removed=true; try{ peer.destroy(); }catch(e){} renderStudent(); return; }
    if(!m || m.t!=="state") return;
    const prevG=S.state&&S.state.me.gid;
    S.state=m; if(m.me.gid!==prevG) S.first=true;
    renderStudent();
  });
  c.on("close",()=>{ if(S.conn===c && !S.removed){ netMode="offline"; renderStudent(); retry(); } });
  c.on("error",()=>{});
}

const views={};
function toPx(q,r){ return [W*(q+r/2), 1.5*R*r]; }
function toAxial(x,y){
  let q=(Math.sqrt(3)/3*x - y/3)/R, r=(2/3*y)/R, s=-q-r;
  let rq=Math.round(q), rr=Math.round(r), rs=Math.round(s);
  const dq=Math.abs(rq-q), dr=Math.abs(rr-r), ds=Math.abs(rs-s);
  if(dq>dr && dq>ds) rq=-rr-rs; else if(dr>ds) rr=-rq-rs;
  return [rq,rr];
}
function titleSize(t){ const n=t.length; return n>34?13:n>24?14.5:n>14?16:18; }
function hexEl(c,k,opts){
  opts=opts||{};
  const e=el("div","hex"+(c.s==="Wild Card"?" wild":"")+(opts.static?" static":"")); e.dataset.id=c.id;
  const long=(c.f||"").length>60;
  e.style.setProperty("--w",(W*k)+"px"); e.style.setProperty("--h",(H*k)+"px");
  e.style.setProperty("--ts",((long?Math.min(14.5,titleSize(c.t)):titleSize(c.t))*k)+"px");
  e.style.setProperty("--fs",((long?9.2:10.5)*k)+"px");
  e.style.setProperty("--sc",`var(${SETVAR[c.s]})`);
  const ins=n=>`${n*k}px`;
  e.innerHTML=`<div class="o"></div><div class="m" style="inset:${ins(2)}"></div><div class="c" style="inset:${ins(7)}"></div><div class="i" style="inset:${ins(11)}"><div class="t"></div>${c.f?'<div class="f"></div>':''}</div>`;
  e.querySelector(".t").textContent=c.t; if(c.f) e.querySelector(".f").textContent=c.f;
  e.setAttribute("aria-label",c.t);
  if(opts.editable){
    const b=el("button","edit","✎"); b.title="Write your own term"; b.setAttribute("aria-label","Write on this card");
    b.style.width=b.style.height=Math.max(20,26*k)+"px"; b.style.fontSize=Math.max(10,13*k)+"px";
    b.addEventListener("pointerdown",ev=>ev.stopPropagation());
    b.addEventListener("click",ev=>{ ev.stopPropagation(); openWrite(curGroup(), c.id); });
    e.appendChild(b);
  }
  return e;

  const zi=el("button","btn","+"), zf=el("button","btn","⤢"), zo=el("button","btn","−");
  zi.setAttribute("aria-label","Zoom in"); zf.setAttribute("aria-label","Fit board"); zo.setAttribute("aria-label","Zoom out");
  zi.onclick=()=>zoomBy(1.2); zo.onclick=()=>zoomBy(1/1.2); zf.onclick=()=>{ const g=curGroup(); if(g) fitView(g.id); };
  z.append(zi,zf,zo); b.appendChild(z);
  b.addEventListener("pointerdown",e=>{
    if(e.button!==0 || e.target.closest(".hex,.zoomctl,button")) return;
    const g=curGroup(); if(!g) return; const v=view(g.id), sx=e.clientX, sy=e.clientY, ox=v.x, oy=v.y; b.classList.add("panning");
    const mv=ev=>{ v.x=ox+ev.clientX-sx; v.y=oy+ev.clientY-sy; $("world").style.transform=`translate(${v.x}px,${v.y}px) scale(${v.z})`; };
    const up=()=>{ b.classList.remove("panning"); document.removeEventListener("pointermove",mv); document.removeEventListener("pointerup",up); };
    document.addEventListener("pointermove",mv); document.addEventListener("pointerup",up);
  });
  b.addEventListener("wheel",e=>{ e.preventDefault(); zoomBy(e.deltaY<0?1.1:1/1.1, e.clientX, e.clientY); },{passive:false});
  return b;
}
function view(gid){ if(!views[gid]){ const b=$("board"), r=b?b.getBoundingClientRect():{width:800,height:500}; views[gid]={x:r.width/2,y:r.height/2,z:0.8}; } return views[gid]; }
function zoomBy(f,cx,cy){
  const g=curGroup(), b=$("board"); if(!g||!b) return; const v=view(g.id), r=b.getBoundingClientRect();
  const px=(cx==null?r.left+r.width/2:cx)-r.left, py=(cy==null?r.top+r.height/2:cy)-r.top;
  const nz=Math.min(2.5,Math.max(0.25,v.z*f)); v.x=px-(px-v.x)*nz/v.z; v.y=py-(py-v.y)*nz/v.z; v.z=nz;
  $("world").style.transform=`translate(${v.x}px,${v.y}px) scale(${v.z})`;
}
function fitView(gid,soft){
  const g=role==="teacher"?G(gid):curGroup(), b=$("board"); if(!g||!b) return;
  const r=b.getBoundingClientRect(), v=view(gid), ids=inZone(g,"board");
  if(!ids.length){ v.x=r.width/2; v.y=r.height/2; v.z=0.8; }
  else{
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    ids.forEach(id=>{ const e=ent(g,id), [x,y]=toPx(e.q,e.r); x0=Math.min(x0,x-W/2); x1=Math.max(x1,x+W/2); y0=Math.min(y0,y-H/2); y1=Math.max(y1,y+H/2); });
    const z=Math.min(1.3,Math.max(0.25,Math.min((r.width-60)/(x1-x0),(r.height-60)/(y1-y0))));
    v.z=z; v.x=r.width/2-(x0+x1)/2*z; v.y=r.height/2-(y0+y1)/2*z;
  }
  $("world").style.transform=`translate(${v.x}px,${v.y}px) scale(${v.z})`;
}
let drag=null, pendingRender=false, hotSlot=null;
function drawBoard(g,opts){
  const world=$("world"); if(!world) return; const v=view(g.id);
  world.style.transform=`translate(${v.x}px,${v.y}px) scale(${v.z})`; world.innerHTML="";
  const ids=inZone(g,"board");
  if(drag){
    const occ=new Set(ids.filter(id=>id!==drag.id).map(id=>ent(g,id).q+","+ent(g,id).r)), set=new Set();
    const dirs=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
    if(!occ.size) set.add("0,0");
    occ.forEach(k=>{ const [q,r]=k.split(",").map(Number); dirs.forEach(([a,b])=>{ const kk=(q+a)+","+(r+b); if(!occ.has(kk)) set.add(kk); }); });
    if(hotSlot) set.add(hotSlot);
    set.forEach(k=>{ const [q,r]=k.split(",").map(Number), [x,y]=toPx(q,r), s=el("div","slot"+(hotSlot===k?" hot":"")); s.style.cssText=`width:${W}px;height:${H}px;left:${x-W/2}px;top:${y-H/2}px`; world.appendChild(s); });
  }
  ids.forEach(id=>{
    const e=ent(g,id), c=cardView(g,id), [x,y]=toPx(e.q,e.r);
    const h=hexEl(c,1,{editable: role==="student" && c.w && e.o===S.sid}); h.style.left=(x-W/2)+"px"; h.style.top=(y-H/2)+"px"; h.dataset.from="board";
    if(drag && drag.id===id) h.classList.add("dragging");
    attachDrag(h,g); world.appendChild(h);
  });
  const em=$("empty"); em.hidden=ids.length>0;
  em.innerHTML = role==="teacher" ? "<div><strong>Empty board</strong>When students place cards, they show up here. Use Deal to give this group's students their cards.</div>"
                                  : "<div><strong>Your group's board</strong>Tap or drag a card from your hand to place it. Connect cards that are related, edge to edge.</div>";
}
function attachDrag(h,g0){
  h.addEventListener("pointerdown",e=>{
    if(e.button!==0) return; e.stopPropagation();
    const id=h.dataset.id, from=h.dataset.from, sx=e.clientX, sy=e.clientY; let moved=false, ghost=null;
    const move=ev=>{
      if(!moved && Math.hypot(ev.clientX-sx,ev.clientY-sy)<6) return;
      const g=curGroup(); if(!g) return;
      if(!moved){ moved=true; drag={id,from}; const z=view(g.id).z; ghost=hexEl(cardView(g,id),z); ghost.classList.add("ghost"); document.body.appendChild(ghost); drawBoard(g); }
      const z=view(g.id).z; ghost.style.left=(ev.clientX-W*z/2)+"px"; ghost.style.top=(ev.clientY-H*z/2)+"px";
      const b=$("board").getBoundingClientRect(); let hs=null;
      if(ev.clientX>=b.left&&ev.clientX<=b.right&&ev.clientY>=b.top&&ev.clientY<=b.bottom){ const v=view(g.id); const [q,r]=toAxial((ev.clientX-b.left-v.x)/v.z,(ev.clientY-b.top-v.y)/v.z); hs=q+","+r; }
      if(hs!==hotSlot){ hotSlot=hs; drawBoard(g); }
    };
    const up=ev=>{
      document.removeEventListener("pointermove",move); document.removeEventListener("pointerup",up); document.removeEventListener("pointercancel",up);
      const g=curGroup(); const hs=hotSlot; hotSlot=null;
      if(ghost) ghost.remove();
      const wasDrag=moved; drag=null;
      if(g){
        if(!wasDrag){ if(from==="hand" && ev.type!=="pointercancel"){ const [q,r]=spiralFree(g); doPlace(g,id,q,r); } }
        else if(hs && ev.type!=="pointercancel"){ const [q,r]=hs.split(",").map(Number); doPlace(g,id,q,r); }
      }
      if(pendingRender || wasDrag){ pendingRender=false; role==="teacher"?renderTeacher():renderStudent(); }
    };
    document.addEventListener("pointermove",move); document.addEventListener("pointerup",up); document.addEventListener("pointercancel",up);
  });
}
function doPlace(g,id,q,r){
  if(role==="teacher"){ if(placeCard(g,null,id,q,r,true)) changed(); else toast("That spot is taken"); return; }
  const e=ent(g,id), occ=occupant(g,q,r);
  if(e.z==="hand" && occ){ toast("That spot is taken. Pick an open space."); return; }
  if(placeCard(g,S.sid,id,q,r,false)){ renderStudent(); send({t:"place",cid:id,q,r}); }
}

  const m=$("main"); m.innerHTML=""; const c=el("div","center"), b=el("div","card-box"); c.appendChild(b); m.appendChild(c);

    if(k.length!==5){ out.textContent="Room codes have 5 letters or numbers."; return cd.focus(); }
    if(!window.Peer){ out.textContent="Live rooms can't load on this network. Tell your teacher."; return; }
    startStudent(k,n); };
  [nm,cd].forEach(i=>i.addEventListener("keydown",e=>{ if(e.key==="Enter") jb.click(); }));
  j.append(nm,cd,jb); b.appendChild(j);
  const t=el("div","choice"); t.appendChild(el("b",null,"Teacher: open a room"));
  t.appendChild(el("p",null,"Your device runs the room: you'll place students in groups, deal cards, and project each group's board. Keep this tab open while students play."));
  const tr=el("div","row"); const tn=el("button","btn primary","Open a new room");
  tn.onclick=()=>{ if(!window.Peer){ out.textContent="Live rooms can't load on this network."; return; } T.game=null; startTeacher(newCode(),0); };
  tr.appendChild(tn);
  const last=store.get("hexlive-lastroom"); if(last){ const ro=el("button","btn","Reopen room "+last); ro.onclick=()=>{ if(!window.Peer){ out.textContent="Live rooms can't load on this network."; return; } startTeacher(last,0); }; tr.appendChild(ro); }
  t.appendChild(tr); b.appendChild(t);
  b.appendChild(out); if(msg) out.textContent=msg; else if(!window.Peer) out.textContent="Live rooms can't load on this network, so this page can't connect.";
  setTimeout(()=>(nm.value?cd:nm).focus(),50);
}
window.addEventListener("resize",()=>{ if(role==="teacher" && T.screen==="class") renderTeacher(); });
lobby();
})();
